name: V45 Apply Map Layout Fix

on:
  push:
    branches: [v45-map-spawns-and-routes-overhaul]
    paths:
      - .github/workflows/v45-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded layout corrections
        run: python3 tools/apply_v45_map_layout.py
      - name: Validate all inline Javascript and narrow diff
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess,sys
          class Parser(HTMLParser):
            def __init__(self):super().__init__();self.on=False;self.buf=[];self.scripts=[]
            def handle_starttag(self,tag,attributes):
              if tag=='script':
                d=dict(attributes);self.on='src' not in d and d.get('type','').lower() in ('','module','text/javascript');self.buf=[]
            def handle_data(self,data):
              if self.on:self.buf.append(data)
            def handle_endtag(self,tag):
              if tag=='script':
                if self.on:self.scripts.append(''.join(self.buf))
                self.on=False
          s=Path('index.html').read_text(encoding='utf-8')
          p=Parser();p.feed(s)
          assert p.scripts,'missing game scripts'
          assert 'V45 COMPETITIVE SPAWNS AND FREEZE BALANCE' in s
          assert 'MAPS.cargo.spawns.splice(0, 5' not in s
          for i,code in enumerate(p.scripts,1):
            r=subprocess.run(['node','--input-type=module','--check'],input=code,text=True,capture_output=True)
            if r.returncode:sys.exit('Script '+str(i)+' failed: '+r.stderr)
          print('Validated',len(p.scripts),'inline scripts')
          PY
      - name: Commit patch to feature branch only
        run: |
          git config user.name "STRYKE Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "V45 restore proper attacker base, rebalance Cargo sites and pre-round gates"
          git push
