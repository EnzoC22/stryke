name: STRYKE V44 Measured Spawn Balance Apply

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v44-spawn-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only two prevalidated defensive spawn placements
        run: python3 tools/apply_v44_spawn_balance.py
      - name: Guard diff scope and check all inline JavaScript
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, sys
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('/* V44 COMPETITIVE SPAWN BALANCE */')==1
          assert 'MAPS.frostline.spawnsB[0] = [14, -24];' in s
          assert 'MAPS.kairo.spawnsB[0] = [10, -28];' in s
          class Scripts(HTMLParser):
              def __init__(self):super().__init__();self.active=False;self.parts=[];self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      a=dict(attrs);self.active='src' not in a and a.get('type','').lower() in ('','module','text/javascript');self.parts=[]
              def handle_data(self,data):
                  if self.active:self.parts.append(data)
              def handle_endtag(self,tag):
                  if tag=='script':
                      if self.active:self.scripts.append(''.join(self.parts))
                      self.active=False
          parser=Scripts();parser.feed(s)
          if not parser.scripts:sys.exit('Missing JavaScript scripts')
          for i,source in enumerate(parser.scripts,1):
              result=subprocess.run(['node','--check','--input-type=module'],input=source,text=True,capture_output=True)
              if result.returncode:sys.exit(f'Script {i}: {result.stderr}')
          print('V44 map JS syntax validated:',len(parser.scripts),'inline scripts')
          PY
      - name: Commit measured spawn changes
        run: |
          git config user.name "STRYKE Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "STRYKE V44 balance Frostline and Kairo defensive spawns"
          git push
