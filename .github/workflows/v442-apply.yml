name: V44.2 Apply Bomb Deadline Guard

on:
  push:
    branches: [v44-2-combat-network-stability]
    paths:
      - .github/workflows/v442-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply a single server-side bomb deadline guard
        run: python3 tools/apply_v442_bomb_deadline.py
      - name: Verify exact scope and JavaScript syntax
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess,sys
          s=Path('index.html').read_text(encoding='utf-8')
          needle="if (a.k === 'd' && B?.st === 'planted' && now >= B.end) { p.act = null; continue; }"
          assert s.count(needle)==1, 'deadline guard missing or duplicated'
          class Parser(HTMLParser):
              def __init__(self):super().__init__();self.active=False;self.parts=[];self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      a=dict(attrs)
                      self.active='src' not in a and a.get('type','').lower() in ('','text/javascript','module')
                      self.parts=[]
              def handle_data(self,data):
                  if self.active:self.parts.append(data)
              def handle_endtag(self,tag):
                  if tag=='script':
                      if self.active:self.scripts.append(''.join(self.parts))
                      self.active=False
          parser=Parser();parser.feed(s)
          if not parser.scripts:sys.exit('Missing inline scripts')
          for i,source in enumerate(parser.scripts,1):
              out=subprocess.run(['node','--check','--input-type=module'],input=source,text=True,capture_output=True)
              if out.returncode:sys.exit(f'Inline JS {i} invalid: {out.stderr}')
          print('PASS guard scope and',len(parser.scripts),'JavaScript scripts')
          PY
      - name: Commit only the verified game file
        run: |
          git config user.name "STRYKE Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(v44.2): bomb expiry overrides late defuse completion"
          git push
