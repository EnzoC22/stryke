name: V44.2 Read-only Combat Audit

on:
  push:
    branches: [v44-2-combat-network-stability]
    paths:
      - tools/v442_audit.py
      - .github/workflows/v442-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect combat, network and bomb protocol
        run: |
          python3 -m py_compile tools/v442_audit.py
          python3 tools/v442_audit.py
          git diff --exit-code
