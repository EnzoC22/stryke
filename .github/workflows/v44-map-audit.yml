name: STRYKE V44 Map Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v44-map-audit.yml
      - tools/v44_map_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read only map layout and gameplay audit
        run: |
          python3 tools/v44_map_audit.py
          git diff --exit-code
