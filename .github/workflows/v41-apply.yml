name: Apply STRYKE V41

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v41-apply.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V41
        run: python3 tools/apply_v41.py
      - name: Validate
        run: |
          grep -q "V41 OPERATIONS UI + VISUAL OVERHAUL" index.html
          grep -q "COMPETITIVE<br>TACTICAL FPS" index.html
          git diff --check
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "STRYKE Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "STRYKE V41 Operations UI visual overhaul"
          git push
