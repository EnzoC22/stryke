name: V44.1 Multiplayer Audit

on:
  push:
    branches: [v44-1-multiplayer-stability]
    paths:
      - .github/workflows/v441-audit.yml
      - tools/v441_multiplayer_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit multiplayer lifecycle and transport (read only)
        run: |
          python3 tools/v441_multiplayer_audit.py
          git diff --exit-code
