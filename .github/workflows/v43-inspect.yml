name: STRYKE V43 Mobile Diagnostics

on:
  push:
    paths:
      - .github/workflows/v43-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print mobile interaction anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          patterns=[
            r'function (?:togglePause|showPause|openPause|closePause|resumeGame|pauseGame|mobileGameOn|mobileGameOff|openBuy|closeBuy|mapInteract|zUse)\b',
            r'id="(?:pause|buy|mobileControls|mUse|mBoard|mPause)"',
            r'KeyE',r'KeyF',r'C\.buyOpen',r'function releaseInput\b',r'function mobileBind\b',
            r'z-index:\s*\d+',r'\.hidden\s*\{'
          ]
          for p in patterns:
            print('\nPATTERN',p,flush=True)
            for i,m in enumerate(re.finditer(p,s)):
              if i>=14: break
              print('OFFSET',m.start(), 'CONTEXT', repr(s[max(0,m.start()-130):m.end()+300]),flush=True)
          PY
