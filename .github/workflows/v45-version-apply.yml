name: Apply STRYKE V45 Version Label
on:
  push:
    branches: [v45-map-spawns-and-routes-overhaul]
    paths:
      - .github/workflows/v45-version-apply.yml
permissions:
  contents: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/v45_version_patch.py
      - run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -q 'V45 TACTICAL MAPS' index.html
      - run: |
          git config user.name "STRYKE Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "chore(v45): display tactical map overhaul in menu"
          git push
